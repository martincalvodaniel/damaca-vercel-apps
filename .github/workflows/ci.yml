name: CI

on:
  push:
    branches: [ int, main ]
  pull_request:
    branches: [ int, main ]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Select Biome comparison base
        id: base
        env:
          BASE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_BRANCH: ${{ github.base_ref }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "sha=$(git merge-base "$PUSH_SHA" "$PR_BASE")" >> "$GITHUB_OUTPUT"
          elif [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            echo "sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$(git rev-list --max-parents=0 "$PUSH_SHA")" >> "$GITHUB_OUTPUT"
          fi
      - name: Biome changed files
        run: bun run lint --changed --since="${{ steps.base.outputs.sha }}"
      - name: Type Check
        run: bun run type-check
      - name: Test
        run: bun run test
